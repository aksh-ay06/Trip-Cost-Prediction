    "google-cloud-storage>=2.18",
    "google-cloud-bigquery-storage>=2.25",
    "db-dtypes>=1.3",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "xgboost>=2.1",
    "scikit-learn>=1.5",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "dbt-bigquery>=1.8",
    "pyspark>=3.5",
    "streamlit>=1.38",
    "requests>=2.32",
]
