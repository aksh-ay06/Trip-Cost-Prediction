id: taxi_pipeline
namespace: mlops

# gcp_project and keys_dir come from the ENV_GCP_PROJECT and ENV_KEYS_DIR
# variables passed to the Kestra container (see docker-compose.yml and .env).
variables:
  gcp_project: "{{ envs.gcp_project }}"
  docker_image: mlops-pipeline:latest
  keys_volume: "{{ envs.keys_dir }}:/app/keys:ro"

tasks:
  - id: extract_data
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      image: "{{ vars.docker_image }}"
      volumes:
        - "{{ vars.keys_volume }}"
    env:
      GCP_PROJECT: "{{ vars.gcp_project }}"
      GOOGLE_APPLICATION_CREDENTIALS: /app/keys/my_keys.json
    commands:
      - python -m src.data.extract

  - id: load_to_bq
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      image: "{{ vars.docker_image }}"
      volumes:
        - "{{ vars.keys_volume }}"
    env:
      GCP_PROJECT: "{{ vars.gcp_project }}"
      GOOGLE_APPLICATION_CREDENTIALS: /app/keys/my_keys.json
    commands:
      - python -m src.data.load_to_bq

  - id: feature_engineering
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      image: "{{ vars.docker_image }}"
      volumes:
        - "{{ vars.keys_volume }}"
    env:
      GCP_PROJECT: "{{ vars.gcp_project }}"
      GOOGLE_APPLICATION_CREDENTIALS: /app/keys/my_keys.json
    commands:
      - python -m src.processing.features

  - id: dbt_run
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      image: "{{ vars.docker_image }}"
      volumes:
        - "{{ vars.keys_volume }}"
    env:
      GCP_PROJECT: "{{ vars.gcp_project }}"
      GOOGLE_APPLICATION_CREDENTIALS: /app/keys/my_keys.json
    commands:
      - cd /app/dbt && dbt deps --profiles-dir . && dbt run --profiles-dir .

  - id: train_model
    type: io.kestra.plugin.scripts.shell.Commands
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      image: "{{ vars.docker_image }}"
      volumes:
        - "{{ vars.keys_volume }}"
    env:
      GCP_PROJECT: "{{ vars.gcp_project }}"
      GOOGLE_APPLICATION_CREDENTIALS: /app/keys/my_keys.json
    commands:
      - python -m src.training.train
