volumes:
  postgres_data:
    driver: local
  kestra_data:
    driver: local

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kestra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-kestra}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kestra}"]
      interval: 10s
      retries: 5

  kestra:
    image: kestra/kestra:latest
    pull_policy: always
    user: "root"
    command: server standalone --flow-path=/app/flows
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-kestra}
            driverClassName: org.postgresql.Driver
            username: ${POSTGRES_USER:-kestra}
            password: ${POSTGRES_PASSWORD}
        kestra:
          repository:
            type: postgres
          storage:
            type: local
            local:
              base-path: "/app/storage"
          queue:
            type: postgres
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp
          url: http://localhost:8080/
          server:
            basic-auth:
              enabled: true
              username: "${KESTRA_ADMIN_USER:?Set KESTRA_ADMIN_USER in .env}"
              password: "${KESTRA_ADMIN_PASSWORD:?Set KESTRA_ADMIN_PASSWORD in .env}"
      # Exposed to flows as {{ envs.gcp_project }} and {{ envs.keys_dir }}
      ENV_GCP_PROJECT: "${GCP_PROJECT:?Set GCP_PROJECT in .env}"
      ENV_KEYS_DIR: "${KEYS_DIR:?Set KEYS_DIR in .env (absolute host path to the keys folder)}"
    volumes:
      - kestra_data:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd
      - ./kestra/flows:/app/flows:ro
      - ./keys:/app/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
